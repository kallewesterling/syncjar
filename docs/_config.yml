title: Syncjar
description: Edit, preview and sync Skilljar course content from your own machine.
url: https://kallewesterling.github.io
baseurl: /syncjar

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache

logo: /assets/logo.png
favicon_ico: /assets/logo.png
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  Syncjar on GitHub: https://github.com/kallewesterling/syncjar
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/kallewesterling/syncjar
gh_edit_branch: dev
gh_edit_source: docs
gh_edit_view_mode: edit

footer_content: >-
  Syncjar is an independent open-source tool and is not affiliated with
  Skilljar. Released under the MIT licence.

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue

# Internal working notes; not part of the published site.
exclude:
  - plans/
