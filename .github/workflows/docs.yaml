# Builds the documentation site in docs/ and publishes it to GitHub Pages.
#
# Pull requests build only, so a broken page or link fails the PR. The
# site is deployed from main alone, because it documents the released
# version: dev would publish features nobody can install yet.
name: docs

on:
  pull_request:
    branches: [dev, main]
    paths: ['docs/**', '.github/workflows/docs.yaml']
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yaml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
